services:
  mysql:
    image: mysql:26.7.0
    container_name: server-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laboratorio_db
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

 
volumes:
  db_data:
  maven_repo:
