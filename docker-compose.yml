services:
  mysql:
    image: mysql:8.4
    container_name: server-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laboratorio_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio OPCIONAL: compila y empaqueta el jar dentro de un contenedor con
  # Maven, sin necesidad de instalar Maven en tu máquina.
  # Uso: docker compose run --rm build
  build:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - maven_repo:/root/.m2
    command: ["mvn", "-B", "clean", "package"]
    profiles:
      - build

volumes:
  db_data:
  maven_repo:
