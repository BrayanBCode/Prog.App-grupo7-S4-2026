services:
  mysql:
    image: mysql:26.7.0
    container_name: server-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laboratorio_db
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  tomcat:
    image: tomcat:10.1-jdk21
    container_name: server-tomcat
    ports:
      - "8080:8080"
    volumes:
      - ./servidor-web/target/servidor-web-TU_VERSION.war:/usr/local/tomcat/webapps/servidor-web.war
    depends_on:
      - server-mysql

volumes:
  db_data:
  maven_repo:
